name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: snakyv
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C08457&color_dots=%232B1D16,%235C4033,%238B5E3C,%23C08457,%23E0A96D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23C08457&color_dots=%232B1D16,%235C4033,%238B5E3C,%23C08457,%23E0A96D

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
